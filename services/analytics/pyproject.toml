[project]
name = "accident-black-spot-analytics"
version = "0.1.0"
description = "Clusters approved incident reports and mines patterns to propose black spot candidates."
readme = "README.md"
requires-python = ">=3.12"

# Deliberately lean. `geopandas` appears in the Phase 0 stack list but is not
# installed: DBSCAN's haversine metric comes from scikit-learn, and nothing in
# this service reads or writes a geospatial file format. It can be added the day
# something needs it — an unused compiled dependency is only a liability.
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.34",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "numpy>=2.0",
    "scikit-learn>=1.5",
    "firebase-admin>=6.6",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "httpx>=0.28",
    # The FP-Growth oracle our own ECLAT is cross-validated against. A test
    # dependency, never imported by `app/` — see docs/eclat-methodology.md.
    "mlxtend>=0.23",
    "pandas>=2.2",
    "ruff>=0.8",
    "mypy>=1.13",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = [
    "E",    # pycodestyle
    "F",    # pyflakes
    "I",    # isort
    "B",    # bugbear
    "UP",   # pyupgrade
    "SIM",  # simplify
    "RUF",
]

# Set-theory notation in the ECLAT docstrings. RUF002 flags these as characters
# that could be confused with ASCII, which is a fair default — but here they are
# the actual mathematics being described, and spelling them out would make the
# algorithm's explanation harder to follow, not easier.
allowed-confusables = ["∪", "∩", "≤", "×"]

[tool.mypy]
python_version = "3.12"
strict = true
# Neither ships type stubs. Everything crossing these boundaries is validated by
# Pydantic on the way in, so the loss of static coverage is bounded and visible.
[[tool.mypy.overrides]]
module = ["sklearn.*", "firebase_admin.*", "mlxtend.*", "google.auth.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
# Determinism is a stated acceptance criterion for this phase, so a test that
# only passes sometimes is a failure. -p no:randomly keeps ordering fixed if the
# plugin is ever installed.
addopts = "-q --strict-markers"
